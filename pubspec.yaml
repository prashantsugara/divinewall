name: deva_aura
description: "DivineWall provides a serene collection of Hindu God wallpapers, offering an elegant and inspiring way to personalize your Android device with beautiful imagery and spiritual devotion."
publish_to: "none"
version: 1.0.0+21

environment:
  sdk: ^3.6.0

dependencies:
  image: ^4.0.0
  flutter_local_notifications: ^19.5.0
  in_app_review: ^2.0.0
  permission_handler: ^12.0.0
  timezone: ^0.10.0
  flutter_timezone: ^3.0.0 # [FIX] Required for local timezone
  firebase_messaging: ^16.0.0
  media_store_plus: 0.1.3
  facebook_app_events: 0.20.1
  google_mobile_ads: ^6.0.0
  flutter_wallpaper_manager: 0.0.4
  path_provider: ^2.0.0
  file_saver: 0.3.1
  http: ^1.0.0
  firebase_storage: ^13.0.0
  file_picker: '>=8.1.2'
  share_plus: ^12.0.0
  photo_view: 0.15.0
  google_sign_in: '>=6.2.1'
  firebase_auth: '>=5.3.3'
  cloud_firestore: '>=5.5.0'
  shared_preferences: any
  cached_network_image: ^3.0.0
  flutter_cache_manager: ^3.3.1
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0
  firebase_core: ^4.1.1
  gal: ^2.3.0
  url_launcher: ^6.3.0
  font_awesome_flutter: ^10.7.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/

flutter_launcher_icons:
  # Use adaptive icons on Android so the launcher uses your logo cleanly
  android: "adaptive"
  ios: true
  # Explicitly set platform-specific image paths
  image_path_android: assets/images/logo.png
  image_path_ios: assets/images/logo.png
  # Adaptive layers for modern Android launchers
  adaptive_icon_foreground: assets/images/logo.png
  adaptive_icon_background: "#FFFFFF"
  # Android 12+ specific definition to avoid automatic masking
  android_12:
    image_path: assets/images/logo.png
    icon_background_color: "#FFFFFF"
  # iOS alpha removal is recommended
  remove_alpha_ios: true
