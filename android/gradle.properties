org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true

# Ensure all Kotlin compilations (including transitive plugins) target JVM 17
# This fixes errors like:
# "Inconsistent JVM-target compatibility detected for tasks 'compileDebugJavaWithJavac' (17)
#  and 'compileDebugKotlin' (1.8)"
kotlin.compiler.jvmTarget=17
# Silences strict validation noise when third‑party plugins still declare 1.8 internally
kotlin.jvm.target.validation.mode=warning
